version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: campusguard-db
    environment:
      POSTGRES_USER: campus_admin
      POSTGRES_PASSWORD: campus_password
      POSTGRES_DB: campusguard
    ports:
      - "5477:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: campusguard-storage
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    ports:
      - "9001:9000"
      - "9091:9090"
    command: server /data --console-address ":9090"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: campusguard-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2182:2181"
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: campusguard-kafka
    depends_on:
      - zookeeper
    ports:
      - "9093:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9093,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    restart: unless-stopped

  api:
    build: ./backend
    container_name: campusguard-api
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - minio
      - kafka
    environment:
      - DATABASE_URL=postgresql://campus_admin:campus_password@postgres:5432/campusguard
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: campusguard-frontend
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
